<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ctSpaces walkthroughs</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#151518;color:#f4f3f6}*{box-sizing:border-box}body{margin:0 auto;padding:28px;max-width:1500px}h1{font-size:28px;margin:0 0 10px}p{color:#c1bec9;line-height:1.55}button,a{font:inherit}button{color:inherit;background:#2a292f;border:1px solid #56515f;border-radius:7px;padding:10px 15px;cursor:pointer}button:hover{background:#3a3441}button:focus-visible,a:focus-visible{outline:3px solid #f19bb8;outline-offset:3px}button[aria-pressed=true],button[aria-current=true]{background:#782543;border-color:#d7678f}nav{display:flex;gap:10px;margin:22px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.screen{position:relative;background:#000;border-radius:8px;overflow:hidden}video{display:block;width:100%;aspect-ratio:8/5}.caption{position:absolute;left:8%;right:8%;bottom:65px;text-align:center;pointer-events:none}.caption span{background:#000e;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:5px 9px;line-height:1.8;font-size:17px}.chapters{display:flex;flex-direction:column;gap:8px}.chapters button{text-align:left;display:grid;grid-template-columns:42px 1fr;gap:10px}.chapters small{color:#c9c3ce}.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0}a{color:#eda8c1}details{margin-top:24px;border-top:1px solid #49434e;padding-top:15px}.transcript p{margin:15px 0}.transcript strong{color:#f5edf2}@media(max-width:850px){body{padding:16px}.layout{grid-template-columns:1fr}.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.caption span{font-size:14px}}
</style>
<h1>ctSpaces in action</h1>
<p>Real recordings of the Windows application, narrated with Kokoro Heart. Watch from the beginning or choose a chapter to jump to a feature.</p>
<nav aria-label="Choose a walkthrough" id="videos"></nav>
<h2 id="title"></h2>
<div class="layout"><div><div class="screen"><video id="video" controls preload="metadata" aria-label="Application walkthrough"></video><div class="caption" id="caption" aria-hidden="true"></div></div><div class="tools"><button id="captions" aria-pressed="true">Captions on</button><a id="download" download>Download MP4</a><a id="subtitles" download>Download subtitles</a><span id="duration"></span></div></div><aside><h3>Chapters</h3><div id="chapters" class="chapters"></div></aside></div>
<details><summary>Read the narration transcript</summary><div class="transcript" id="transcript"></div></details>
<script>
const data=/*VIDEO_DATA*/ [];
const el=id=>document.getElementById(id),video=el('video');let current,showCaptions=true;
const time=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');
function select(i){current=data[i];video.pause();video.src=current.src;el('title').textContent=current.title;el('download').href=current.src;el('subtitles').href=current.id+'.srt';el('duration').textContent=time(current.duration);el('chapters').replaceChildren();el('transcript').replaceChildren();[...el('videos').children].forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));for(const c of current.chapters){const b=document.createElement('button'),s=document.createElement('small'),label=document.createElement('span');s.textContent=time(c.start);label.textContent=c.title;b.append(s,label);b.onclick=()=>{video.currentTime=c.start;video.play().catch(()=>{})};b.dataset.start=c.start;b.setAttribute('aria-current','false');el('chapters').append(b);const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=c.title+' — ';p.append(strong,document.createTextNode(c.text));el('transcript').append(p)}update()}
function update(){if(!current)return;const t=video.currentTime;let active=0;current.chapters.forEach((c,i)=>{if(t>=c.start)active=i});[...el('chapters').children].forEach((b,i)=>b.setAttribute('aria-current',String(i===active)));const c=current.captions.find(c=>t>=c.start&&t<c.end);el('caption').replaceChildren();if(showCaptions&&c){const span=document.createElement('span');span.textContent=c.text;el('caption').append(span)}}
data.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.id==='Notes'?'Client Notes':'ctSpaces';b.onclick=()=>select(i);b.setAttribute('aria-pressed','false');el('videos').append(b)});el('captions').onclick=()=>{showCaptions=!showCaptions;el('captions').setAttribute('aria-pressed',String(showCaptions));el('captions').textContent=showCaptions?'Captions on':'Captions off';update()};video.addEventListener('timeupdate',update);video.addEventListener('seeked',update);if(data.length)select(0);
</script></html>
